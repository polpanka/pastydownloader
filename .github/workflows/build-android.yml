name: Build Android APK

# Manuale (Actions -> Build Android APK -> Run workflow) SOLO, di proposito:
# a differenza degli altri build-*.yml qui NON c'e' "push: tags: v*", quindi
# non allega automaticamente l'APK alle Release quando pushi un tag. E' una
# scelta deliberata: questo resta un guscio sperimentale - ffmpeg (recipe
# locale, vedi android/recipes/ffmpeg/) e yt-dlp funzionano davvero, ma la
# build resta "debug" (chiave [buildozer] mode in pysidedeploy.spec), non
# firmata per una vera release.
# Quando/se si deciderà di distribuirlo davvero, aggiungere qui lo stesso
# trigger "push: tags: v*" degli altri workflow (serve anche una release-key
# vera al posto della firma debug automatica).
#
# Riproduce in CI, passo per passo, l'esperimento fatto a mano in locale
# (vedi ANDROID.md): dieci patch locali non versionabili
# altrimenti (il tool pyside6-android-deploy non espone via CLI ne'
# targetSdk/permessi/requirements/recipe custom/servizi/provider nel
# manifest ne' un modo di riusare un checkout p4a persistente) vengono
# applicate qui da file .patch versionati in android/patches/.
"on":
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Gli NDK/SDK Android e la ricompilazione nativa di CPython/openssl/
      # sqlite3/libffi occupano parecchio spazio - i runner GitHub hanno per
      # default poco spazio libero reale (tool preinstallati non usati qui,
      # es. .NET/Haskell, occupano diversi GB). Liberato preventivamente,
      # pattern comune per build Android su GitHub Actions.
      - name: Libera spazio disco (tool preinstallati non usati qui)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # setup-java esporta gia' JAVA_HOME nell'ambiente dei passi successivi -
      # e' il requisito scoperto in locale (serve la JDK completa per javac,
      # non solo la JRE, vedi ANDROID.md punto 6)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Elenco di dipendenze di sistema scoperto una alla volta in locale
      # (vedi ANDROID.md punto 6: zlib, poi build-essential, poi
      # autoconf/automake/libtool, poi libssl-dev) - qui installate tutte
      # insieme dall'inizio, note gia' complete
      - name: Installa le dipendenze di sistema richieste dalla toolchain Android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zlib1g-dev \
            build-essential \
            autoconf \
            automake \
            libtool \
            libssl-dev \
            patch

      # Venv dedicato Python 3.11 (buildozer/p4a lo richiedono sull'host, non
      # e' il Python cross-compilato dentro l'APK) - stesso path relativo
      # usato da pysidedeploy.spec (python_path = .venv-android/bin/python3.11),
      # gia' committato cosi' com'e' per restare valido sia in locale che qui
      - name: Crea il venv Python 3.11 e installa pyside6-android-deploy
        run: |
          python3.11 -m venv .venv-android
          source .venv-android/bin/activate
          pip install pyside6==6.11.2
          pip install -r .venv-android/lib/python3.11/site-packages/PySide6/scripts/requirements-android.txt

      # Patch 1: il tool pyside6-android-deploy non espone via CLI ne'
      # targetSdk (android.api) ne' permessi extra ne' pin di versione dei
      # requirements (incluso ffmpeg e mutagen) ne' p4a.source_dir - l'unico
      # modo e' patchare il suo file interno (vedi
      # android/patches/buildozer_py_config.patch, generato con "git diff"
      # contro il file pristine della stessa identica versione
      # PySide6==6.11.2 pinnata sopra, quindi deve applicarsi pulito)
      - name: "Patch 1: targetSdk, permessi storage, requirements, p4a.source_dir"
        run: |
          TARGET=".venv-android/lib/python3.11/site-packages/PySide6/scripts/deploy_lib/android/buildozer.py"
          patch -p1 "$TARGET" < android/patches/buildozer_py_config.patch

      # Patch 2: stesso file appena patchato sopra, stesso motivo (nessuna
      # chiave CLI) - qui il permesso POST_NOTIFICATIONS per la notifica di
      # sistema a fine download (vedi android_bridge.py e
      # pythonactivity_notify.patch sotto)
      - name: "Patch 2: permesso POST_NOTIFICATIONS (buildozer.py)"
        run: |
          TARGET=".venv-android/lib/python3.11/site-packages/PySide6/scripts/deploy_lib/android/buildozer.py"
          patch -p1 "$TARGET" < android/patches/buildozer_py_config_notify.patch

      # Patch 3: stesso file ancora - permesso FOREGROUND_SERVICE e
      # registrazione di DownloadForegroundService nel manifest (via
      # --native-service, vedi p4a.extra_args) per tenere il processo
      # esente dal freeze in background durante un download (vedi
      # android_bridge.py, pythonactivity_foreground_service.patch sotto e
      # ANDROID_HISTORY.md)
      - name: "Patch 3: Foreground Service per i download in background (buildozer.py)"
        run: |
          TARGET=".venv-android/lib/python3.11/site-packages/PySide6/scripts/deploy_lib/android/buildozer.py"
          patch -p1 "$TARGET" < android/patches/buildozer_py_config_foreground_service.patch

      # Patch 4: stesso file ancora - copia file_paths.xml in
      # res/xml/ (via --resource, vedi p4a.extra_args) e abilita AndroidX
      # (--enable-androidx, richiede android.api >= 28 - il nostro e' 28) per
      # androidx.core.content.FileProvider usato da PythonActivity per aprire
      # un file gia' scaricato dal doppio click su una riga completata (vedi
      # android_bridge.py, pythonactivity_openfile.patch e
      # android_manifest_fileprovider.patch sotto)
      - name: "Patch 4: FileProvider per aprire i file scaricati (buildozer.py)"
        run: |
          TARGET=".venv-android/lib/python3.11/site-packages/PySide6/scripts/deploy_lib/android/buildozer.py"
          patch -p1 "$TARGET" < android/patches/buildozer_py_config_fileprovider.patch

      # NDK/SDK Android (vedi ANDROID.md punto 2) - JAVA_HOME e' gia' in
      # ambiente grazie a setup-java sopra
      - name: Scarica NDK/SDK Android
        run: |
          git clone --depth 1 https://code.qt.io/pyside/pyside-setup /tmp/pyside-setup
          source .venv-android/bin/activate
          pip install -r /tmp/pyside-setup/tools/cross_compile_android/requirements.txt
          python /tmp/pyside-setup/tools/cross_compile_android/main.py \
            --download-only --skip-update --auto-accept-license

      # Bug dello script di download sopra (vedi ANDROID.md punto 6, "Terzo
      # tentativo"): mette cmdline-tools direttamente sotto android-sdk/
      # invece del layout cmdline-tools/latest/ atteso da sdkmanager/
      # buildozer - fix identico a quello fatto a mano in locale. Il symlink
      # va sui singoli file, non sulla cartella bin intera (sdkmanager
      # risolve i symlink solo sul file invocato direttamente)
      - name: Sistema il layout cmdline-tools/latest dell'SDK
        run: |
          SDK="$HOME/.pyside6_android_deploy/android-sdk"
          mv "$SDK/cmdline-tools" "$SDK/cmdline-tools-tmp"
          mkdir -p "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools-tmp" "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/tools/bin"
          for f in "$SDK/cmdline-tools/latest/bin/"*; do
            ln -s "../../cmdline-tools/latest/bin/$(basename "$f")" "$SDK/tools/bin/$(basename "$f")"
          done

      # Wheel PySide6/Shiboken6 per Android (vedi ANDROID.md punto 3):
      # qtpip richiede un account commerciale, le wheel open source si
      # scaricano dirette da download.qt.io senza account
      - name: Scarica le wheel PySide6/Shiboken6 per Android
        run: |
          mkdir -p "$HOME/.pyside6_android_deploy/wheels"
          cd "$HOME/.pyside6_android_deploy/wheels"
          curl -fLO https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl
          curl -fLO https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

      # Patch 5: python-for-android clonato in un checkout separato che
      # pysidedeploy.spec trova via p4a.source_dir (patch 1). **Pinnato a un
      # commit preciso**: p4a 'develop' e' instabile e si muove ogni giorno -
      # una versione diversa da quella contro cui sono stati generati i patch
      # 6-9 fa fallire 'git apply', o (peggio) applica con contesto sbagliato
      # e produce una build rotta. Questo commit e' quello con cui la build
      # locale funziona; aggiornarlo solo dopo aver riverificato i patch.
      - name: "Patch 5: richiesta permesso runtime storage + ANDROID_NATIVE_LIBS (PythonActivity.java)"
        env:
          P4A_COMMIT: 7af1d1325ef460def993cc7871c43d04bc877a94
        run: |
          P4A_DIR="$HOME/.pyside6_android_deploy/python-for-android"
          mkdir -p "$P4A_DIR" && cd "$P4A_DIR"
          git init -q
          git remote add origin https://github.com/kivy/python-for-android.git
          git fetch -q --depth 1 origin "$P4A_COMMIT"
          git checkout -q FETCH_HEAD
          git apply "$GITHUB_WORKSPACE/android/patches/pythonactivity_permissions.patch"

      # Patch 6: stesso file appena patchato sopra - notifica di sistema
      # a fine download, vedi android_bridge.py
      - name: "Patch 6: notifica di sistema a fine download (PythonActivity.java)"
        run: |
          cd "$HOME/.pyside6_android_deploy/python-for-android"
          git apply "$GITHUB_WORKSPACE/android/patches/pythonactivity_notify.patch"

      # Patch 7: stesso file ancora, piu' un file nuovo
      # (DownloadForegroundService.java) - Foreground Service per i download
      # in background, vedi android_bridge.py e ANDROID_HISTORY.md
      - name: "Patch 7: Foreground Service per i download in background (PythonActivity.java)"
        run: |
          cd "$HOME/.pyside6_android_deploy/python-for-android"
          git apply "$GITHUB_WORKSPACE/android/patches/pythonactivity_foreground_service.patch"

      # Patch 8: stesso file ancora - legge una richiesta scritta da
      # Tools.openFile (libs.py) e apre il file con l'app predefinita del
      # sistema tramite un content:// URI (FileProvider, patch 9/10 sotto),
      # vedi android_bridge.py e ANDROID_HISTORY.md
      - name: "Patch 8: apertura file scaricati dal doppio click (PythonActivity.java)"
        run: |
          cd "$HOME/.pyside6_android_deploy/python-for-android"
          git apply "$GITHUB_WORKSPACE/android/patches/pythonactivity_openfile.patch"

      # Patch 9: file diverso dello stesso checkout p4a (il template del
      # manifest, non PythonActivity.java) - dichiara il FileProvider usato
      # dalla patch 8/10 sopra. Nessun hook CLI/args esistente per aggiungere
      # un <provider> dentro <application> (a differenza di native_services/
      # add_activity), quindi il template va patchato direttamente
      - name: "Patch 9: dichiarazione FileProvider nel manifest (AndroidManifest.tmpl.xml)"
        run: |
          cd "$HOME/.pyside6_android_deploy/python-for-android"
          git apply "$GITHUB_WORKSPACE/android/patches/android_manifest_fileprovider.patch"

      # Patch 10: find_recipe_dir() del tool forza sempre le recipe dentro
      # "deployment/", cartella che pyside6-android-deploy ripulisce con
      # shutil.rmtree() a ogni run --force (vedi deploy_lib/deploy_util.py:
      # cleanup) - le recipe custom (android/recipes/ffmpeg/,
      # android/recipes/libshine/) sparirebbero prima ancora che la build
      # parta se non venissero ricopiate li' dentro ad ogni run. Senza
      # questa patch la build userebbe le recipe originali di p4a (nessuna
      # recipe libshine statica ufficiale, e per ffmpeg fallirebbe -
      # dependency graph/build order/ar mancante/simboli a runtime, vedi i
      # commenti in android/recipes/ffmpeg/__init__.py)
      - name: "Patch 10: copia le recipe locali in deployment/recipes/ ad ogni run"
        run: |
          TARGET=".venv-android/lib/python3.11/site-packages/PySide6/scripts/deploy_lib/android/android_config.py"
          patch -p1 "$TARGET" < android/patches/android_config_local_recipes.patch

      - name: Build APK
        run: |
          source .venv-android/bin/activate
          export JAVA_HOME="$JAVA_HOME_21_X64"
          # --keep-deployment-files: senza, pyside6-android-deploy sposta
          # .buildozer dentro deployment/ e poi cancella deployment/, buttando
          # via i log della build. In CI il runner e' effimero, li teniamo.
          set -o pipefail
          pyside6-android-deploy --config-file pysidedeploy.spec \
            --wheel-pyside "$HOME/.pyside6_android_deploy/wheels/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl" \
            --wheel-shiboken "$HOME/.pyside6_android_deploy/wheels/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl" \
            --ndk-path "$HOME/.pyside6_android_deploy/android-ndk/android-ndk-r27c" \
            --sdk-path "$HOME/.pyside6_android_deploy/android-sdk" \
            --keep-deployment-files --force 2>&1 | tee deploy.log
          # pyside6-android-deploy esce 0 anche quando la build fallisce
          # davvero (cattura l'eccezione e la stampa soltanto) - qui la
          # trasformiamo in un fallimento vero dello step
          if grep -q "Exception occurred:" deploy.log; then
            echo "::error::pyside6-android-deploy ha fallito internamente (cerca 'Exception occurred:' sopra)"
            exit 1
          fi

      - name: Trova e rinomina l'APK prodotto
        run: |
          APK=$(find "$GITHUB_WORKSPACE" "$HOME/.buildozer" deployment -type f \
                  -name 'PastyDownloader*arm64-v8a*debug*.apk' 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::APK non trovato dopo la build"
            echo "--- tutti i .apk presenti ---"
            find "$GITHUB_WORKSPACE" "$HOME" -name '*.apk' -type f 2>/dev/null || true
            exit 1
          fi
          echo "APK trovato: $APK"
          mv "$APK" "$GITHUB_WORKSPACE/PastyDownloader-android-arm64-v8a-debug.apk"

      - name: Carica l'APK come artefatto della run
        uses: actions/upload-artifact@v7
        with:
          name: PastyDownloader-android-arm64-v8a-debug.apk
          path: PastyDownloader-android-arm64-v8a-debug.apk

      - name: Carica i log della build (per diagnosi, anche su fallimento)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            deploy.log
            .buildozer/**/*.log
            .buildozer/**/*.txt
            deployment/.buildozer/**/*.log
            deployment/.buildozer/**/*.txt
          if-no-files-found: ignore
