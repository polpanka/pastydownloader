name: Build Linux AppImage

# Manuale (Actions -> Build Linux AppImage -> Run workflow) o automatico quando pushi un tag di versione, es. v0.9
# ("on" tra virgolette: senza, alcuni parser YAML - non GitHub Actions, che lo gestisce correttamente - lo confondono col booleano true)
"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # serve solo per allegare l'AppImage alla Release quando il trigger e' un tag

jobs:
  build-linux:
    # ubuntu-22.04 e non ubuntu-latest (24.04): un runner piu' vecchio ha una
    # glibc piu' vecchia (2.35 contro 2.39), quindi l'AppImage risultante
    # richiede meno ai sistemi su cui poi girera' - stesso principio discusso
    # per ffmpeg_linux. Non ha senso scendere sotto 22.04: le wheel PySide6
    # attuali sono gia' manylinux_2_34, quindi 2.35 e' comunque il minimo
    # praticamente raggiungibile con questa versione di PySide6.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Il runner nudo non ha le librerie di sistema che Qt6Gui e il plugin
      # xcb richiedono sempre (anche se l'app non usa mai OpenGL/EGL o le
      # estensioni X11 a runtime) - su un desktop Linux vero arrivano quasi
      # sempre gia' con i driver GPU/l'ambiente grafico. Senza, linuxdeploy si
      # rifiuta di dispiegare i plugin ("ERROR: Could not find dependency:
      # ..."). Set standard e documentato per Qt6/xcb headless su Ubuntu -
      # messo tutto insieme per evitare altri giri di "manca anche questa"
      - name: Installa le librerie di sistema richieste da Qt6/xcb (il runner non le ha di default)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Compila l'AppImage
        # "bash build-appimage.sh" e non "./build-appimage.sh": non richiede il
        # bit eseguibile sul file, che si perde facilmente se lo si ricarica a
        # mano nel repo (es. upload via interfaccia web di GitHub)
        run: bash build-appimage.sh

      - name: Verifica che l'AppImage parta (nessun crash)
        run: |
          # APPIMAGE_EXTRACT_AND_RUN: i runner GitHub non hanno FUSE, quindi
          # anche l'AppImage appena prodotta va eseguita in autoestrazione,
          # non solo linuxdeploy/appimagetool (gia' gestiti da build-appimage.sh)
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QT_QPA_PLATFORM=offscreen
          timeout 10 ./bin/PastyDownloader-x86_64.AppImage &
          pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            echo "OK: ancora in esecuzione dopo 5s, nessun crash"
            kill "$pid"
          else
            wait "$pid"; code=$?
            echo "L'AppImage si e' chiusa da sola, exit code $code" >&2
            exit 1
          fi

      - name: Carica l'AppImage come artefatto della run
        uses: actions/upload-artifact@v7
        with:
          name: PastyDownloader-x86_64.AppImage
          path: bin/PastyDownloader-x86_64.AppImage

      - name: Allega l'AppImage alla Release (solo per i tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/PastyDownloader-x86_64.AppImage
