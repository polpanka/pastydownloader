name: Build macOS

# Manuale (Actions -> Build macOS -> Run workflow) o automatico quando pushi un tag di versione, es. v0.9
# ("on" tra virgolette: senza, alcuni parser YAML - non GitHub Actions, che lo gestisce correttamente - lo confondono col booleano true)
"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # serve solo per allegare l'app alla Release quando il trigger e' un tag

# NIENTE NOTARIZATION, per scelta esplicita (nessun account Apple Developer,
# nessun costo): l'app viene firmata solo "ad-hoc" da PyInstaller in modo
# automatico (codesign_identity=None in main_mac.spec => firma ad-hoc di
# default, non "nessuna firma") - questo basta a farla PARTIRE su Apple
# Silicon (l'unica cosa che il kernel richiede sempre, vedi AMFI), ma NON
# basta a evitare l'avviso di Gatekeeper "sviluppatore non identificato" per
# chi la scarica da internet. Chi scarica l'app dovra' fare, una volta:
# Impostazioni di Sistema -> Privacy e Sicurezza -> in fondo, "Apri comunque"
# (su macOS Sequoia+ il vecchio tasto destro "Apri" non basta piu' da solo) -
# vale la pena scriverlo chiaro nella pagina di download.
jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon nativo
          - arch: arm64
            runner: macos-14
          # Intel nativo - "macos-15-intel" e' l'ULTIMO runner x86_64 offerto
          # da GitHub Actions per macOS, in dismissione ad agosto 2027: dopo
          # quella data questa riga andra' rimossa o sostituita (a quel punto
          # gli utenti Intel dovranno usare Rosetta 2 sulla build arm64, o
          # andra' verificata la disponibilita' di un build universal2)
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        # PySide6 pinnato (non l'ultima versione disponibile): il floor minimo
        # di macOS richiesto dal wheel PySide6/Qt e' salito nel tempo -
        # 6.5.3-6.7.x richiedono macOS 11+ (Big Sur), 6.8.x-6.9.x macOS 12+
        # (Monterey), 6.10+ macOS 13+ (Ventura) - installando "PySide6" senza
        # versione si prende sempre l'ultima, quindi il floor si alza da solo
        # ad ogni nuova release Qt anche senza che questo repo cambi nulla.
        # 6.7.3 (settembre 2024) e' l'ultima release che sta ancora sul floor
        # piu' basso (macOS 11), prima che salisse a 12 con la 6.8: e' il
        # miglior compromesso reach/aggiornamento, dato che il wheel e'
        # universal2 (arm64+x86_64 nello stesso file, stesso floor per
        # entrambe le architetture). Andare piu' indietro (6.5.0-6.5.2,
        # floor macOS 10.9) allargherebbe fino a Catalina, ma quell'OS non
        # riceve piu' patch di sicurezza da Apple dal 2022: non vale il
        # costo di restare ancora piu' indietro per un pubblico ormai residuale.
        # NB: il floor dichiarato dal wheel PyPI e' quello "promesso", non e'
        # detto coincida al 100% con quanto imbarcato nel binario finale dopo
        # PyInstaller/codesign sul runner CI (vedi la Symbol-not-found vista su
        # un Mac Catalina con la build 6.11 non pinnata) - verificare con un
        # avvio reale su un Mac macOS 11-13 dopo aver aggiornato questo pin.
        run: |
          python3 -m pip install --upgrade pip
          pip install PySide6==6.7.3 aiofiles aiohttp psutil requests pyinstaller brotli certifi mutagen pycryptodomex websockets urllib3 yt-dlp-ejs curl_cffi
          # quickjs-ng (motore JS embedded per risolvere le sfide di YouTube
          # senza un runtime esterno, vedi Tools._registerEmbeddedQuickJsProvider
          # in libs.py): pubblica un wheel precompilato solo per macOS
          # arm64, non x86_64 - un pip install bloccante romperebbe l'intera
          # build sul runner Intel (macos-15-intel). Installazione best-effort:
          # se fallisce (Intel), l'app funziona comunque, semplicemente senza
          # questo provider (stesso comportamento di prima di questa aggiunta,
          # vedi il try/except in _registerEmbeddedQuickJsProvider)
          pip install quickjs-ng || echo "quickjs-ng non disponibile per questa architettura (${{ matrix.arch }}), continuo senza"

      - name: Rigenera resources.py con la stessa versione di PySide6 appena installata
        run: pyside6-rcc resources.qrc -o resources.py

      - name: Compila con PyInstaller
        run: pyinstaller installer/main_mac.spec

      - name: Verifica che l'app parta (nessun crash)
        run: |
          export QT_QPA_PLATFORM=offscreen
          "dist/PastyDownloader.app/Contents/MacOS/PastyDownloader" &
          pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            echo "OK: ancora in esecuzione dopo 5s, nessun crash"
            kill "$pid"
          else
            wait "$pid"; code=$?
            echo "L'app si e' chiusa da sola, exit code $code" >&2
            exit 1
          fi

      - name: Comprimi l'app in zip
        run: |
          mkdir -p bin
          # ditto (non zip): e' lo strumento di Apple pensato apposta per
          # archiviare bundle .app preservando xattr/firma ad-hoc intatti
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/PastyDownloader.app" \
            "bin/PastyDownloader-macos-${{ matrix.arch }}.app.zip"

      - name: Carica l'app come artefatto della run
        uses: actions/upload-artifact@v7
        with:
          name: PastyDownloader-macos-${{ matrix.arch }}
          path: bin/PastyDownloader-macos-${{ matrix.arch }}.app.zip

      - name: Allega l'app alla Release (solo per i tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/PastyDownloader-macos-${{ matrix.arch }}.app.zip
